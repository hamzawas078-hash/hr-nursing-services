<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.R Nursing Services</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            text-align: center;
        }

        /* Header / Navbar */
        header {
            background-color: #0d6efd;
            color: white;
            padding: 30px 15px 20px 15px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Hero Section */
        .hero {
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            color: #1a1a1a;
            margin-bottom: 30px;
        }

        .hero-img {
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .hero p {
            font-size: 1.15rem;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Button */
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .btn-whatsapp:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>H.R Nursing Services</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#careers">Careers</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="hero">
        <h2>Professional<br>Nursing Care At<br>Your Doorstep</h2>

        <!-- Image -->
        <img src="banner.jpg" alt="H.R Nursing Services Banner" class="hero-img">

        <p>Professional Nursing Services available in North Karachi, New Karachi & Surjani Town.</p>

        <!-- WhatsApp Button -->
        <a href="https://wa.me/923162738844" class="btn-whatsapp" target="_blank">
            <i class="fa-regular fa-comment-dots"></i> WhatsApp Now
        </a>
    </main>

</body>
</html>
